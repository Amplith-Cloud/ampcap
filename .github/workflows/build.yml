name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # AmpCap ships 64-bit only on Windows.
  windows:
    name: windows (${{ matrix.brand }})
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        # amplithian is the default branding; others are applied from
        # ampcap/brands/<brand>/ and tag their file names with it
        include:
          - brand: amplithian
            tag: ''
            name_tag: ''
          - brand: fmplus
            tag: -fmplus
            name_tag: -FMplus
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3

      - name: Apply ${{ matrix.brand }} branding
        if: matrix.brand != 'amplithian'
        shell: bash
        run: cp -v ampcap/brands/${{ matrix.brand }}/* ampcap/

      # The project still targets the VS 2013 toolset (v120) with no SDK
      # version; retarget to VS 2022 (v143) and the Windows 10 SDK here
      # rather than in the project, so upstream merges stay clean.
      - name: Build AmpCap.exe
        run: >
          msbuild ampcap\ampcap\ampcap.sln -m
          /p:Configuration=Release
          /p:Platform=x64
          /p:PlatformToolset=v143
          /p:WindowsTargetPlatformVersion=10.0
          /p:OutDir=${{ github.workspace }}\out\x64\

      - name: Stage executable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item out\x64\ampcap.exe dist\AmpCap${{ matrix.name_tag }}-x64.exe

      # installer.nsi installs the x64 build to $PROGRAMFILES64 and refuses
      # to run on 32-bit Windows.
      - name: Build installer
        shell: pwsh
        run: |
          $nsis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          if (-not (Test-Path $nsis)) { choco install nsis -y --no-progress }
          New-Item -ItemType Directory -Force ampcap\release | Out-Null
          Copy-Item out\x64\ampcap.exe ampcap\release\AmpCap.exe
          & $nsis ampcap\installer.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $installer = Get-Item ampcap\ampcap*-install.exe
          Copy-Item $installer ("dist\" + $installer.BaseName.Replace("-install", "${{ matrix.tag }}-install") + ".exe")

      - name: Checksums
        shell: pwsh
        run: |
          Get-ChildItem dist -File | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name
          } | Set-Content dist\SHA256SUMS-windows-x64${{ matrix.tag }}.txt
          Get-Content dist\SHA256SUMS-windows-x64${{ matrix.tag }}.txt

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: dist/*.exe

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ampcap-windows-x64${{ matrix.tag }}
          path: dist/
          if-no-files-found: error

  macos:
    name: macos (${{ matrix.brand }})
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        # amplithian is the default branding; others are applied from
        # ampcap/brands/<brand>/ and tag their file names with it
        include:
          - brand: amplithian
            tag: ''
            name_tag: ''
          - brand: fmplus
            tag: -fmplus
            name_tag: -FMplus
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The Xcode project runs WDL/swell/swell_resgen.sh, which needs php.
      - name: Install php
        run: command -v php || brew install php

      - name: Apply ${{ matrix.brand }} branding
        if: matrix.brand != 'amplithian'
        shell: bash
        run: cp -v ampcap/brands/${{ matrix.brand }}/* ampcap/

      # Deployment target 10.7 is below what current Xcode supports; build a
      # universal, ad-hoc signed app. Developer ID signing and notarization
      # are not done in CI yet.
      - name: Build AmpCap.app
        run: |
          xcodebuild -project ampcap/ampcap.xcodeproj -alltargets -configuration Release \
            SYMROOT="$PWD/build" \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            MACOSX_DEPLOYMENT_TARGET=10.13 \
            CODE_SIGN_IDENTITY=- CODE_SIGNING_REQUIRED=NO

      - name: Package
        run: |
          mkdir -p dist
          ditto -c -k --keepParent build/Release/AmpCap.app dist/AmpCap${{ matrix.name_tag }}-macos-universal.zip
          (cd dist && shasum -a 256 *.zip > SHA256SUMS-macos${{ matrix.tag }}.txt && cat SHA256SUMS-macos${{ matrix.tag }}.txt)

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: github.event_name != 'pull_request'
        with:
          subject-path: dist/*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ampcap-macos${{ matrix.tag }}
          path: dist/
          if-no-files-found: error

  # Pushing a tag like v1.33 publishes the Windows and macOS builds as a
  # GitHub Release. The tag must match AMPCAP_VERSION in
  # ampcap/ampcap_version.h, and tags with a "-" (v1.33-beta) are marked
  # as pre-releases.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows, macos]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check tag matches AMPCAP_VERSION
        run: |
          version=$(sed -n 's/^#define AMPCAP_VERSION "\(.*\)"/\1/p' ampcap/ampcap_version.h)
          if [ "${GITHUB_REF_NAME%%-*}" != "$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match AMPCAP_VERSION $version"
            exit 1
          fi

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - name: Combine checksums
        run: |
          cd dist
          cat SHA256SUMS-*.txt > SHA256SUMS.txt
          rm SHA256SUMS-*.txt
          cat SHA256SUMS.txt

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<NOTES
          These builds are not code-signed yet. Windows SmartScreen and macOS Gatekeeper will warn on first launch.

          Check a download against \`SHA256SUMS.txt\`, or verify its build provenance with:

              gh attestation verify <file> --repo ${GITHUB_REPOSITORY}
          NOTES
          prerelease=""
          case "$GITHUB_REF_NAME" in *-*) prerelease="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag $prerelease \
            --title "AmpCap $GITHUB_REF_NAME" \
            --notes-file notes.md --generate-notes
